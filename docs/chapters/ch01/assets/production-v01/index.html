  <script>
    const records=[{"id": "BG-01", "title": "沪海市公寓卧室", "file": "backgrounds/BG-01.png", "src": "backgrounds/BG-01.png", "available": true, "prompt": "沿用用户已认可的BG-01原图。", "notes": "CH01-001", "category": "background"}, {"id": "BG-02", "title": "公寓厨房", "file": "backgrounds/BG-02.png", "src": "backgrounds/BG-02.png", "available": true, "prompt": "Use case: precise-object-edit. Edit this approved kitchen watercolor illustration. Preserve its entire composition, camera, apartment architecture, table, chairs, breakfast food, color palette, paper texture and lighting exactly. Add ONE clearly visible coffee cup at the right-hand breakfast place next to the right-hand plate, so there are exactly two distinct coffee cups for two people. Make no other additions. No text, logo, people or UI. Keep full landscape 16:9 framing.", "notes": "CH01-002", "category": "background"}, {"id": "BG-03", "title": "沪海市早高峰街道", "file": "backgrounds/BG-03.png", "src": "backgrounds/BG-03.png", "available": true, "prompt": "Use case: illustration-story. Create one complete landscape visual novel background, 16:9 framing, target 1920x1080. Image 1 and image 2 are approved STYLE references only unless explicitly specified as an edit target below. Match their fine low contrast grey-brown hand drawn outlines, delicate translucent watercolor wash, gentle natural lighting, warm paper texture and restrained lived-in detail density. New requested locations must NOT become kitchens or bedrooms. Set in ordinary modern China in 2030. Coherent architectural perspective. Low saturation natural colors; cold scenes may be cool grey-blue, preserve the same watercolor technique, do not force a yellow filter. No photorealism, no 3D, no thick black outlines, no vector flat fills, no hyperdetailed anime faces, no luxury interiors, no ruined city unless specified. No main characters; distant incidental people may be simplified faceless silhouettes. No readable text, no branding logos, no watermark, no UI or dialogue boxes. Leave sides reasonably usable for sprites and bottom quarter usable for dialogue, but draw the entire background.\nScene BG-03 沪海市早高峰街道: 2030年的现代东亚超大型城市，参考上海普通商业与住宅混合区域的早高峰街道。道路两侧是现代办公楼和居民楼，街边有早餐店、便利店、共享单车和公交站。机动车交通较拥挤，远处有人通过人行横道。天气晴朗但天空略显灰白，建筑色调真实克制。采用人行道上的平视镜头，构图具有都市生活的流动感。不可出现末日废墟。\nContinuity: Pedestrian eye-level camera, functioning Chinese city with restrained grey-white sky. Keep shops signage abstract unlettered, traffic drives on right.", "notes": "CH01-003、CH01-004、CH01-B01、CH01-C01", "category": "background"}, {"id": "BG-04", "title": "地铁站台", "file": "backgrounds/BG-04.png", "src": "backgrounds/BG-04.png", "available": true, "prompt": "Use case: lighting-weather. Edit this watercolor metro platform, preserving composition, glass screen doors, passengers, perspective, pillars and fine watercolor style. It must be UNDERGROUND: remove all sunlight beams and golden sun patches on floor, replace with even neutral COOL WHITE fluorescent tube lighting. Any city scenery seen in panels must clearly be flat unlettered advertising artwork on opaque panels, NOT exterior windows or sunlight. Behind platform screen doors only dark track tunnel and dim train shapes, no open sky, no outdoor urban skyline. Keep soft paper texture, low saturation, no legible signage or new text. No main characters.", "notes": "CH01-A01、CH01-D01", "category": "background"}, {"id": "BG-05", "title": "公寓夜晚", "file": "backgrounds/BG-05.png", "src": "backgrounds/BG-05.png", "available": true, "prompt": "Use case: illustration-story. Create one complete landscape visual novel background, 16:9 framing, target 1920x1080. Image 1 and image 2 are approved STYLE references only unless explicitly specified as an edit target below. Match their fine low contrast grey-brown hand drawn outlines, delicate translucent watercolor wash, gentle natural lighting, warm paper texture and restrained lived-in detail density. New requested locations must NOT become kitchens or bedrooms. Set in ordinary modern China in 2030. Coherent architectural perspective. Low saturation natural colors; cold scenes may be cool grey-blue, preserve the same watercolor technique, do not force a yellow filter. No photorealism, no 3D, no thick black outlines, no vector flat fills, no hyperdetailed anime faces, no luxury interiors, no ruined city unless specified. No main characters; distant incidental people may be simplified faceless silhouettes. No readable text, no branding logos, no watermark, no UI or dialogue boxes. Leave sides reasonably usable for sprites and bottom quarter usable for dialogue, but draw the entire background.\nImage2 is also the apartment continuity reference. Make a nighttime version of that SAME living/dining/kitchen view, preserve window left, sofa front-left, wooden table center, kitchen and fridge back-right, side corridor on right. Two cups, phone and modest papers on table replace breakfast. No plants or furniture added. Warm lamp light in room, blue city beyond left balcony. Maintain same fixed furniture geometry and lens. 与BG-01、BG-02属于同一套公寓，展示客厅与餐厅。现代简约家具、沙发、茶几、小型餐桌、落地窗、电视及生活用品。晚上八点左右，室内暖黄色灯光与窗外城市冷蓝色灯光形成对比。窗外可以看见高层建筑与高架道路的车流。空间不大，但布置舒适。整体有生活气息，同时通过窗外略显阴沉的天空制造轻微不安。", "notes": "CH01-A02、CH01-A03、CH01-B03、CH01-C03、CH01-D01", "category": "background"}, {"id": "BG-06", "title": "城市超市与药店", "file": "backgrounds/BG-06.png", "src": "backgrounds/BG-06.png", "available": true, "prompt": "Use case: illustration-story. Create one complete landscape visual novel background, 16:9 framing, target 1920x1080. Image 1 and image 2 are approved STYLE references only unless explicitly specified as an edit target below. Match their fine low contrast grey-brown hand drawn outlines, delicate translucent watercolor wash, gentle natural lighting, warm paper texture and restrained lived-in detail density. New requested locations must NOT become kitchens or bedrooms. Set in ordinary modern China in 2030. Coherent architectural perspective. Low saturation natural colors; cold scenes may be cool grey-blue, preserve the same watercolor technique, do not force a yellow filter. No photorealism, no 3D, no thick black outlines, no vector flat fills, no hyperdetailed anime faces, no luxury interiors, no ruined city unless specified. No main characters; distant incidental people may be simplified faceless silhouettes. No readable text, no branding logos, no watermark, no UI or dialogue boxes. Leave sides reasonably usable for sprites and bottom quarter usable for dialogue, but draw the entire background.\nScene BG-06 城市超市与药店: 现代中国连锁超市内部，整齐排列的货架、购物车、食品、罐头、瓶装水和日用品。部分货架出现明显空缺，但没有发生打砸或暴力事件。冷白色照明，宽敞的购物通道，少量顾客在远处采购商品。画面重点表现正常商业秩序开始承受压力。构图对称，货架形成具有压迫感的纵深透视。\nContinuity: Ordinary Chinese supermarket grocery aisles; gaps in masks and essentials shelves, bottles and cans have indistinct blank labels. Pharmacy is represented only by appropriate small health goods section, no invented readable signs.", "notes": "CH01-A03", "category": "background"}, {"id": "BG-07", "title": "沪海市出城道路", "file": "backgrounds/BG-07.png", "src": "backgrounds/BG-07.png", "available": true, "prompt": "Use case: illustration-story. Create one complete landscape visual novel background, 16:9 framing, target 1920x1080. Image 1 and image 2 are approved STYLE references only unless explicitly specified as an edit target below. Match their fine low contrast grey-brown hand drawn outlines, delicate translucent watercolor wash, gentle natural lighting, warm paper texture and restrained lived-in detail density. New requested locations must NOT become kitchens or bedrooms. Set in ordinary modern China in 2030. Coherent architectural perspective. Low saturation natural colors; cold scenes may be cool grey-blue, preserve the same watercolor technique, do not force a yellow filter. No photorealism, no 3D, no thick black outlines, no vector flat fills, no hyperdetailed anime faces, no luxury interiors, no ruined city unless specified. No main characters; distant incidental people may be simplified faceless silhouettes. No readable text, no branding logos, no watermark, no UI or dialogue boxes. Leave sides reasonably usable for sprites and bottom quarter usable for dialogue, but draw the entire background.\nScene BG-07 沪海市出城道路: 2030年中国东部大型都市外围的城市快速路，远处仍有高楼和大型交通立交。清晨光照略显灰冷，大量私家车缓慢排列在道路上，部分道路出现临时交通引导设施。车辆以现代新能源轿车、SUV及物流货车为主。画面从车内前挡风玻璃视角观察道路，强调拥堵、等待和漫长的车流。不是战争场景，也不是废弃公路。\nContinuity: A route version: traffic jam. View from passenger/driver seat inside a modern purple SU7 sedan, only bottom edge of dark dashboard, no person or hands. Chinese right-hand traffic, parallel motorway lanes, slow queues, restrained grey dawn. Vehicle interior must match BG16 later.", "notes": "CH01-A04、CH01-C04", "category": "background"}, {"id": "BG-08", "title": "高速服务区广场", "file": "backgrounds/BG-08.png", "src": "backgrounds/BG-08.png", "available": true, "prompt": "Use case: illustration-story. Create one complete landscape visual novel background, 16:9 framing, target 1920x1080. Image 1 and image 2 are approved STYLE references only unless explicitly specified as an edit target below. Match their fine low contrast grey-brown hand drawn outlines, delicate translucent watercolor wash, gentle natural lighting, warm paper texture and restrained lived-in detail density. New requested locations must NOT become kitchens or bedrooms. Set in ordinary modern China in 2030. Coherent architectural perspective. Low saturation natural colors; cold scenes may be cool grey-blue, preserve the same watercolor technique, do not force a yellow filter. No photorealism, no 3D, no thick black outlines, no vector flat fills, no hyperdetailed anime faces, no luxury interiors, no ruined city unless specified. No main characters; distant incidental people may be simplified faceless silhouettes. No readable text, no branding logos, no watermark, no UI or dialogue boxes. Leave sides reasonably usable for sprites and bottom quarter usable for dialogue, but draw the entire background.\nScene BG-08 高速服务区广场: 中国高速公路大型服务区，傍晚五点半左右，天空开始转暗。停车场停满现代轿车、SUV、货车和大客车。服务区建筑具有便利店、餐饮区、洗手间及停车指示设施。人群较为密集，但初始秩序仍然正常。摄像机采用略微宽广的地面视角，展示停车区与服务区建筑的整体关系。低饱和暖灰色光照，表现旅途疲惫和日渐增长的压抑感。\nContinuity: Establish a reusable service area: modest two-storey grey cream motorway building across back, broad parking plaza, chargers off to right, single white coach parked on left near access lane, cars and lorries parked orderly. No panic yet. 17:26 muted sunset.", "notes": "CH01-A05", "category": "background"}, {"id": "BG-09", "title": "高速服务区充电区", "file": "backgrounds/BG-09.png", "src": "backgrounds/BG-09.png", "available": true, "prompt": "Use case: illustration-story. Create one complete landscape visual novel background, 16:9 framing, target 1920x1080. Image 1 and image 2 are approved STYLE references only unless explicitly specified as an edit target below. Match their fine low contrast grey-brown hand drawn outlines, delicate translucent watercolor wash, gentle natural lighting, warm paper texture and restrained lived-in detail density. New requested locations must NOT become kitchens or bedrooms. Set in ordinary modern China in 2030. Coherent architectural perspective. Low saturation natural colors; cold scenes may be cool grey-blue, preserve the same watercolor technique, do not force a yellow filter. No photorealism, no 3D, no thick black outlines, no vector flat fills, no hyperdetailed anime faces, no luxury interiors, no ruined city unless specified. No main characters; distant incidental people may be simplified faceless silhouettes. No readable text, no branding logos, no watermark, no UI or dialogue boxes. Leave sides reasonably usable for sprites and bottom quarter usable for dialogue, but draw the entire background.\nImage3 is the established SAME SERVICE AREA layout reference: modest two-storey grey cream building, coach left, charger zone right. Reuse its design and geographical relation for the new specified viewpoint. Scene BG-09: 现代高速服务区新能源汽车充电区域，数排直流快充设备、停车位、充电线缆和排队车辆。傍晚柔和的光线逐渐暗淡，车位排列较紧密。画面采用稍低的停车场视角，能够     const groups=[["background", "背景"], ["cg", "剧情插画"], ["character", "人物立绘"], ["variant", "状态变体"]];
    const gallery=document.getElementById('gallery'),viewer=document.getElementById('viewer');
    const search=document.getElementById('search');let selected='all',filtered=[],currentIndex=-1;
    const escapeHTML=(value)=>String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    document.getElementById('total').textContent=`${records.length} 张资源图`;
    function render(){
      const needle=search.value.trim().toLocaleLowerCase('zh-CN');
      filtered=records.filter(r=>(selected==='all'||r.category===selected)&&`${r.id} ${r.title} ${r.notes} ${r.prompt}`.toLocaleLowerCase('zh-CN').includes(needle));
      gallery.innerHTML=groups.map(([key,label])=>{
        const items=filtered.filter(r=>r.category===key);if(!items.length)return '';
        const cards=items.map(r=>{
          const position=records.indexOf(r);
          const image=r.available?`<img src="${escapeHTML(r.src)}" alt="${escapeHTML(r.title)}" loading="lazy" decoding="async">`:'<span class="missing">图片待补充</span>';
          const footer=r.available?`<div class="card-footer"><a href="${escapeHTML(r.src)}" target="_blank" rel="noopener">查看原图</a><button data-description="${position}">画面说明</button></div>`:'';
          return `<article class="card ${key}"><button class="open-image" data-open="${position}" aria-label="放大：${escapeHTML(r.title)}" ${r.available?'':'disabled'}>${image}</button><div class="caption"><div class="card-id">${escapeHTML(r.id)}</div><h3>${escapeHTML(r.title)}</h3>${r.notes?`<p class="notes">${escapeHTML(r.notes)}</p>`:''}${footer}</div></article>`;
        }).join('');
        return `<section class="section" aria-label="${label}"><div class="section-head"><h2>${label}</h2><span class="section-count">${items.length} 张</span><span class="section-line"></span></div><div class="grid">${cards}</div></section>`;
      }).join('');
      document.getElementById('empty').hidden=filtered.length>0;
    }
    function openImage(record,showDescription=false){
      if(!record||!record.available)return;
      currentIndex=filtered.indexOf(record);
      document.getElementById('viewer-title').textContent=`${record.id} · ${record.title}`;
      const image=document.getElementById('viewer-image');image.src=record.src;image.alt=record.title;image.classList.toggle('character',record.category==='character');
      document.getElementById('viewer-notes').textContent=record.notes;
      document.getElementById('viewer-original').href=record.src;
      document.getElementById('viewer-prompt').textContent=record.prompt;
      const details=document.getElementById('viewer-details');details.hidden=!record.prompt;details.open=showDescription;
      document.getElementById('previous').disabled=!filtered.slice(0,currentIndex).some(r=>r.available);
      document.getElementById('next').disabled=!filtered.slice(currentIndex+1).some(r=>r.available);
      if(!viewer.open)viewer.showModal();
    }
    function move(direction){let position=currentIndex+direction;while(position>=0&&position<filtered.length){if(filtered[position].available){openImage(filtered[position]);return;}position+=direction;}}
    gallery.addEventListener('click',event=>{const target=event.target.closest('[data-open],[data-description]');if(!target)return;const index=Number(target.dataset.open??target.dataset.description);openImage(records[index],target.dataset.description!==undefined);});
    document.querySelectorAll('.filter').forEach(button=>button.addEventListener('click',()=>{selected=button.dataset.group;document.querySelectorAll('.filter').forEach(item=>item.setAttribute('aria-pressed',String(item===button)));render();}));
    search.addEventListener('input',render);
    document.getElementById('close').addEventListener('click',()=>viewer.close());
    document.getElementById('previous').addEventListener('click',()=>move(-1));document.getElementById('next').addEventListener('click',()=>move(1));
    viewer.addEventListener('click',event=>{if(event.target!==viewer)return;const box=viewer.getBoundingClientRect();if(event.clientX<box.left||event.clientX>box.right||event.clientY<box.top||event.clientY>box.bottom)viewer.close();});
    viewer.addEventListener('keydown',event=>{if(event.key==='ArrowLeft'){event.preventDefault();move(-1);}if(event.key==='ArrowRight'){event.preventDefault();move(1);}});
    render();
  </script>
